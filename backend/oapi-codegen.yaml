# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: oapi
output: internal/http/oapi/api.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
compatibility:
  # Keep enum constants unambiguous (HealthStatusOk instead of Ok).
  always-prefix-enum-values: true
output-options:
  name-normalizer: ToCamelCaseWithInitialisms
  # Optional arrays/maps are plain slices/maps (nil = absent) instead of *[]T.
  prefer-skip-optional-pointer-on-container-types: true
  # Keep schemas referenced only from `webhooks` (pruning drops them but keeps their aliases).
  skip-prune: true
