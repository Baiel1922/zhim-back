# Hot reload for local development (used by deploy/docker-compose.dev.yml).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = true

[misc]
  clean_on_exit = true
