openapi: 3.1.0
info:
  title: zhim.kg API
  version: 0.3.0
  description: |
    Single source of truth for the zhim.kg API.
    Go server stubs and TypeScript clients are generated from this file (`make gen`).

    Money is integer KGS (som). Public endpoints take `?lang=ru|ky` (default `ru`) and
    return texts in that language. Errors always use the `Error` schema; the frontend
    maps `code` to a translated message.
servers:
  - url: http://localhost:8090
    description: Local development
  - url: https://api.zhim.kg
    description: Production

tags:
  - name: system
    description: Service health and diagnostics
  - name: catalog
    description: Storefront catalog and settings
  - name: checkout
    description: Promo codes and orders
  - name: admin-auth
    description: Admin sign-in (Telegram Mini App) and admin accounts
  - name: admin-catalog
    description: Catalog management
  - name: admin-store
    description: Delivery zones, promo codes and settings
  - name: admin-orders
    description: Order processing and dashboard

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [system]
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/categories:
    get:
      operationId: listCategories
      summary: Categories in display order
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/products:
    get:
      operationId: listProducts
      summary: Active products for the catalog grid
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: category
          in: query
          description: Category slug; omit for all products
          schema:
            type: string
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/ProductSort"
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/products/{slug}:
    get:
      operationId: getProduct
      summary: Full product with variants, images and size chart
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/settings/public:
    get:
      operationId: getPublicSettings
      summary: Contacts, pickup point, hero texts and delivery zones
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Public settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/promo/validate:
    post:
      operationId: validatePromo
      summary: Check a promo code against a cart subtotal
      description: Rate limited per IP. Errors use the promo_* codes.
      tags: [checkout]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoValidateRequest"
      responses:
        "200":
          description: The code applies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoValidation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/orders:
    post:
      operationId: createOrder
      summary: Place an order (guest checkout)
      description: |
        Prices, discount and delivery are recalculated on the server; the response is the
        source of truth. Retrying with the same `Idempotency-Key` returns the original order.
        Rate limited per IP.
      tags: [checkout]
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated unique key (UUID recommended), 8–128 characters
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created (or replayed for a repeated Idempotency-Key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/orders/{number}:
    get:
      operationId: getOrder
      summary: Order status for the thank-you page
      description: The phone acts as a second factor; a wrong phone yields 404. Rate limited per IP.
      tags: [checkout]
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: number
          in: path
          required: true
          schema:
            type: string
            examples: [ZH-000123]
        - name: phone
          in: query
          required: true
          schema:
            type: string
            examples: ["+996700123456"]
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"


  /v1/admin/auth/telegram:
    post:
      operationId: adminAuthTelegram
      summary: "Exchange Telegram Mini App initData for an access token"
      description: "initData is validated with the bot token (HMAC-SHA256) and must be at most 24 hours old; the Telegram user must be an active admin. The token lives 12 hours."
      tags: [admin-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAuthRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/admin/me:
    get:
      operationId: adminGetMe
      summary: "Current admin"
      description: "Roles: owner, manager."
      tags: [admin-auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/categories:
    get:
      operationId: adminListCategories
      summary: "List categories"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: adminCreateCategory
      summary: "Create a category"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCategoryInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/admin/categories/{id}:
    put:
      operationId: adminUpdateCategory
      summary: "Update a category"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCategoryInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: adminDeleteCategory
      summary: "Delete a category"
      description: "Fails with in_use while products reference the category. Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/admin/colors:
    get:
      operationId: adminListColors
      summary: "List colors"
      description: "Needed to label the stock matrix. Roles: owner, manager."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminColorList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: adminCreateColor
      summary: "Create a color"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminColorInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminColor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/admin/colors/{id}:
    put:
      operationId: adminUpdateColor
      summary: "Update a color"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminColorInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminColor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: adminDeleteColor
      summary: "Delete a color"
      description: "Fails with in_use while variants reference the color. Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/admin/size-charts:
    get:
      operationId: adminListSizeCharts
      summary: "List sizecharts"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSizeChartList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: adminCreateSizeChart
      summary: "Create a sizechart"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSizeChartInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSizeChart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/admin/size-charts/{id}:
    put:
      operationId: adminUpdateSizeChart
      summary: "Update a sizechart"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSizeChartInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSizeChart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: adminDeleteSizeChart
      summary: "Delete a sizechart"
      description: "Products that used the chart are left without one. Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/admin/products:
    get:
      operationId: adminListProducts
      summary: "List products (active and hidden)"
      description: "Roles: owner, manager."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: query
          schema:
            type: integer
            format: int64
        - name: q
          in: query
          description: Search by title or slug
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: adminCreateProduct
      summary: "Create a product"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/admin/products/{id}:
    get:
      operationId: adminGetProduct
      summary: "Product with variants and images"
      description: "Roles: owner, manager."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: adminUpdateProduct
      summary: "Update a product"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProductInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: adminDeleteProduct
      summary: "Delete a product with its variants and photos"
      description: "Past orders keep their snapshots. Prefer hiding (is_active=false). Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/products/{id}/variants:
    post:
      operationId: adminCreateVariants
      summary: "Create the size × color matrix"
      description: "Existing combinations are kept as is; SKUs are generated. Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantMatrixInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/variants/{id}:
    put:
      operationId: adminUpdateVariant
      summary: "Update a variant's SKU and visibility"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVariantInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVariant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: adminDeleteVariant
      summary: "Delete a variant"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/variants/{id}/stock:
    put:
      operationId: adminSetVariantStock
      summary: "Set a variant's stock"
      description: "Roles: owner, manager."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVariant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/products/{id}/images:
    post:
      operationId: adminUploadImage
      summary: "Upload a product photo"
      description: "JPEG, PNG or WebP up to 15 MB. The original is stored in S3; imgproxy resizes on the fly. Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUploadForm"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /v1/admin/products/{id}/images/order:
    put:
      operationId: adminReorderImages
      summary: "Reorder product photos"
      description: "image_ids must list every photo of the product exactly once. Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageOrderInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/images/{id}:
    put:
      operationId: adminUpdateImage
      summary: "Bind a photo to a color and set alt texts"
      description: "Roles: owner."
      tags: [admin-catalog]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageInput"
      responses:
