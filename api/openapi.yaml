        - history
        - allowed_statuses
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        payment_status:
          $ref: "#/components/schemas/PaymentStatus"
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        delivery_method:
          $ref: "#/components/schemas/DeliveryMethod"
        delivery_zone:
          $ref: "#/components/schemas/DeliveryZone"
        address:
          type: string
        landmark:
          type: string
        customer_name:
          type: string
        phone:
          type: string
        comment:
          type: string
        internal_comment:
          type: string
        lang:
          $ref: "#/components/schemas/Lang"
        promo_code:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          $ref: "#/components/schemas/Money"
        discount:
          $ref: "#/components/schemas/Money"
        delivery_price:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        attribution:
          $ref: "#/components/schemas/Attribution"
        history:
          type: array
          items:
            $ref: "#/components/schemas/OrderHistoryEntry"
        allowed_statuses:
          description: Statuses the order can move to next
          type: array
          items:
            $ref: "#/components/schemas/OrderStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"

    OrderPaymentInput:
      type: object
      required: [payment_status]
      properties:
        payment_status:
          $ref: "#/components/schemas/PaymentStatus"

    OrderCommentInput:
      type: object
      required: [internal_comment]
      properties:
        internal_comment:
          type: string
          maxLength: 2000

    PeriodStats:
      type: object
      required: [orders, revenue]
      properties:
        orders:
          type: integer
          format: int32
        revenue:
          description: Sum of order totals, KGS (cancelled orders excluded)
          type: integer
          format: int64

    TopProduct:
      type: object
      required: [title, qty, revenue]
      properties:
        product_id:
          description: Absent if the product was deleted
          type: integer
          format: int64
        title:
          type: string
        qty:
          type: integer
          format: int32
        revenue:
          type: integer
          format: int64

    LowStockVariant:
      type: object
      required: [variant_id, product_id, title, color_name, size, sku, stock]
      properties:
        variant_id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        title:
          type: string
        color_name:
          type: string
        size:
          type: string
        sku:
          type: string
        stock:
          type: integer
          format: int32

    Dashboard:
      type: object
      required: [today, last_7_days, last_30_days, top_products, low_stock]
      properties:
        today:
          $ref: "#/components/schemas/PeriodStats"
        last_7_days:
          $ref: "#/components/schemas/PeriodStats"
        last_30_days:
          $ref: "#/components/schemas/PeriodStats"
        top_products:
          description: Best sellers by units over the last 30 days
          type: array
          items:
            $ref: "#/components/schemas/TopProduct"
        low_stock:
          description: Active variants with stock ≤ 2
          type: array
          items:
            $ref: "#/components/schemas/LowStockVariant"

    RevalidateRequest:
      type: object
      required: [tags]
      properties:
        tags:
          description: "Cache tags to revalidate: categories, products, product:<slug>, settings"
          type: array
          items:
            type: string
