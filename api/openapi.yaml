webhooks:
  revalidate:
    post:
      operationId: revalidateStorefront
      summary: Sent by the API to the storefront after catalog or settings changes
      description: |
        POST {WEB_INTERNAL_URL}/api/revalidate with `Authorization: Bearer <REVALIDATE_SECRET>`.
        The storefront calls revalidateTag for each tag. Retried with backoff on failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevalidateRequest"
      responses:
        "200":
          description: Revalidated

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from POST /v1/admin/auth/telegram

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Lang:
      name: lang
      in: query
      description: Response language
      schema:
        $ref: "#/components/schemas/Lang"

  responses:
    Unauthorized:
      description: Missing, invalid or expired token; invalid Telegram initData
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not an active admin, or the role does not allow this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Upload exceeds 15 MB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Upload is not a JPEG, PNG or WebP image
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Malformed request or invalid fields (code validation_error)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Out of stock (see items), Idempotency-Key reused, duplicate value, resource in use or invalid status transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Business rule rejected the request (promo code, delivery zone)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded; see the Retry-After header
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Lang:
      type: string
      enum: [ru, ky]
      default: ru

    Money:
      description: Amount in KGS (som)
      type: integer
      format: int32

    ErrorCode:
      type: string
      enum:
        - validation_error
        - not_found
        - method_not_allowed
        - category_not_found
        - product_not_found
        - order_not_found
        - out_of_stock
        - delivery_zone_unavailable
        - promo_not_found
        - promo_inactive
        - promo_not_started
        - promo_expired
        - promo_exhausted
        - promo_min_total
        - idempotency_conflict
        - rate_limited
        - unauthorized
        - forbidden
        - init_data_invalid
        - init_data_expired
        - not_admin
        - already_exists
        - in_use
        - invalid_status_transition
        - last_owner
        - file_too_large
        - unsupported_media_type
        - internal_error

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          description: Developer-facing description; not meant for display
          type: string
        fields:
          description: Invalid request fields (validation_error)
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        items:
          description: Cart lines that cannot be fulfilled (out_of_stock)
          type: array
          items:
            $ref: "#/components/schemas/StockIssue"
        min_total:
          description: Required cart subtotal (promo_min_total)
          $ref: "#/components/schemas/Money"

    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          description: JSON path of the field, e.g. items[0].qty
          type: string
        code:
          type: string
          enum: [required, invalid, too_long, too_many, taken]

    StockIssue:
      type: object
      required: [variant_id, available]
      properties:
        variant_id:
          type: integer
          format: int64
        available:
          description: Units that can still be ordered (0 if sold out or unavailable)
          type: integer
          format: int32

    Category:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    Color:
      type: object
      required: [id, name, hex]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        hex:
          type: string
          examples: ["#0A0A0A"]

    ImageSource:
      type: object
      required: [src, srcset]
      properties:
        src:
          description: Signed imgproxy URL at the default width (AVIF/WebP by Accept header)
          type: string
        srcset:
          description: Ready-to-use srcset value with width descriptors
          type: string

    Image:
      description: Product photo, 4:5, in thumb/card/full presets
      type: object
      required: [alt, thumb, card, full]
      properties:
        color_id:
          description: Color the photo belongs to; absent = shown for every color
          type: integer
          format: int64
        alt:
          type: string
        thumb:
          $ref: "#/components/schemas/ImageSource"
        card:
          $ref: "#/components/schemas/ImageSource"
        full:
          $ref: "#/components/schemas/ImageSource"

    ProductSort:
      type: string
      enum: [featured, new, price_asc, price_desc]
      default: featured

    ProductCard:
      type: object
      required: [id, slug, title, category_slug, price, is_new, in_stock, sizes, colors, images]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
        category_slug:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        old_price:
          description: Pre-sale price; present only when the product is on sale
          $ref: "#/components/schemas/Money"
        is_new:
          type: boolean
        in_stock:
          type: boolean
        sizes:
          description: Sizes in stock, in size order
          type: array
          items:
            type: string
        colors:
          description: Colors in stock
          type: array
          items:
            $ref: "#/components/schemas/Color"
        images:
          description: Up to two photos (main and hover)
          type: array
          items:
            $ref: "#/components/schemas/Image"

    ProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductCard"

    Variant:
      type: object
      required: [id, color_id, size, sku, stock]
      properties:
        id:
          type: integer
          format: int64
        color_id:
          type: integer
          format: int64
        size:
          type: string
        sku:
          type: string
        stock:
          type: integer
          format: int32

    SizeChartColumn:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string

    SizeChartRow:
      type: object
      required: [size, values]
      properties:
        size:
          type: string
        values:
          description: Measurement ranges keyed by column key
          type: object
          additionalProperties:
            type: string

    SizeFitRule:
      type: object
      required: [size, height_min, height_max, weight_min, weight_max]
      properties:
        size:
          type: string
        height_min:
          type: integer
        height_max:
          type: integer
        weight_min:
          type: integer
        weight_max:
          type: integer

    SizeChart:
      type: object
      required: [unit, columns, rows, fit]
      properties:
        unit:
          type: string
          examples: [cm]
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SizeChartColumn"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SizeChartRow"
        fit:
          description: Size recommendation by height (cm) and weight (kg)
          type: array
          items:
            $ref: "#/components/schemas/SizeFitRule"

    Product:
      type: object
      required:
        [id, slug, title, description, composition, care, price, is_new, category, colors, sizes, variants, images]
      properties:
        id:
